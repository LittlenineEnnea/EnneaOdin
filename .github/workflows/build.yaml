name: Build EnneaOdin

# Release artifacts are built by calling ./build.sh, not by repeating its
# dotnet publish invocation here. That matters: build.sh deliberately does not
# use PublishSingleFile, because an Avalonia publish leaves libSkiaSharp,
# libHarfBuzzSharp and libAvaloniaNative beside the managed binary and the
# binary on its own cannot find them. An earlier version of this workflow did
# use PublishSingleFile and then archived only dist/<rid>/EnneaOdin, so every
# release asset it produced was a binary without its native libraries. Keeping
# one source of truth for how a release is built is what prevents that from
# coming back.
#
# Each asset is therefore the whole publish directory, archived with its
# top-level <rid>/ prefix intact.
#
# build.sh also builds the native protocol engine (Heimdall's C++, under
# native/), so each runner needs cmake, a C++ compiler and the libusb-1.0
# development headers. The engine is NOT cross-compiled: every runtime
# identifier is built on a runner of that kind, which is what this matrix
# already does.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          # macos-13 is the last Intel runner GitHub provides.
          - rid: osx-x64
            runner: macos-13
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # The engine's build prerequisites. cmake and a C++ compiler are already
      # on every GitHub runner; the libusb development package is not.
      - name: Install the native build prerequisites (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: brew install libusb

      - name: Install the native build prerequisites (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libusb-1.0-0-dev

      - name: Build the solution
        run: dotnet build EnneaOdin.sln -c Release

      - name: Publish ${{ matrix.rid }}
        run: ./build.sh ${{ matrix.rid }}

      - name: Archive the publish directory
        run: |
          cd dist
          tar -czf "EnneaOdin-${{ matrix.rid }}.tar.gz" "${{ matrix.rid }}"
          ls -l "EnneaOdin-${{ matrix.rid }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnneaOdin-${{ matrix.rid }}
          path: dist/EnneaOdin-${{ matrix.rid }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/EnneaOdin-*.tar.gz
          generate_release_notes: true
          body: |
            Each asset is a self-contained publish directory for one runtime
            identifier. Extract it and run the EnneaOdin executable from
            inside the extracted directory; the native libraries next to it
            are required - including libenneaodin, which is the Samsung
            download-mode protocol itself and without which every device
            operation is refused.

            libusb-1.0 is a runtime prerequisite and is not bundled. See
            README.md for the install command on each platform.

            The flashing path has not been exercised against a Samsung device.
