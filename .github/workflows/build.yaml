name: Build EnneaOdin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish (osx-arm64)
        run: |
          dotnet publish EnneaOdin/EnneaOdin.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/macos-arm64

      - name: Package into tar.gz
        run: |
          cd dist
          tar -czf EnneaOdin-macos-arm64.tar.gz macos-arm64/EnneaOdin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnneaOdin-macos-arm64
          path: dist/EnneaOdin-macos-arm64.tar.gz

  # ──────────────────────────────────────────────
  # macOS x64 (Intel)
  # ──────────────────────────────────────────────
  build-macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-13            # macos-13 是最后一个 Intel runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish (osx-x64)
        run: |
          dotnet publish EnneaOdin/EnneaOdin.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/macos-x64

      - name: Package into tar.gz
        run: |
          cd dist
          tar -czf EnneaOdin-macos-x64.tar.gz macos-x64/EnneaOdin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnneaOdin-macos-x64
          path: dist/EnneaOdin-macos-x64.tar.gz

  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish (linux-x64)
        run: |
          dotnet publish EnneaOdin/EnneaOdin.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist/linux-x64
          chmod +x dist/linux-x64/EnneaOdin

      - name: Package into tar.gz
        run: |
          cd dist
          tar -czf EnneaOdin-linux-x64.tar.gz linux-x64/EnneaOdin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnneaOdin-linux-x64
          path: dist/EnneaOdin-linux-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-macos-arm64, build-macos-x64, build-linux-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/EnneaOdin-macos-arm64/EnneaOdin-macos-arm64.tar.gz
            artifacts/EnneaOdin-macos-x64/EnneaOdin-macos-x64.tar.gz
            artifacts/EnneaOdin-linux-x64/EnneaOdin-linux-x64.tar.gz
          generate_release_notes: true